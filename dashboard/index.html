<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>THE WRITERS' ROOM — Galactic Coach</title>
<style>
  :root {
    --bg: #0a0d18; --panel: #131a2c; --panel2: #0f1524; --line: #232d47;
    --ink: #dfe6f5; --dim: #8b96b3; --gold: #f2a900; --up: #4ade80;
    --down: #f87171; --mid: #9aa7c7; --blue: #4a9ed4; --purple: #a78bfa; --tag: #1c2540;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background-image: radial-gradient(1px 1px at 20% 30%, #ffffff22 0, transparent 100%),
      radial-gradient(1px 1px at 60% 70%, #ffffff18 0, transparent 100%),
      radial-gradient(1.5px 1.5px at 80% 20%, #ffffff20 0, transparent 100%),
      radial-gradient(1px 1px at 40% 90%, #ffffff15 0, transparent 100%);
  }
  header {
    position: sticky; top: 0; z-index: 10; background: #0a0d18ee; backdrop-filter: blur(6px);
    border-bottom: 1px solid var(--line); padding: 12px 20px 0;
  }
  h1 { margin: 0 0 2px; font-size: 21px; letter-spacing: 3px; color: var(--gold); font-weight: 800; }
  h1 small { color: var(--dim); letter-spacing: 1px; font-size: 12px; font-weight: 400; margin-left: 10px; }
  .sub { color: var(--dim); font-size: 12.5px; margin: 0 0 8px; }
  nav { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; padding-bottom: 10px; }
  .navlab { font-size: 10px; letter-spacing: 2px; color: var(--dim); font-weight: 800; margin: 0 4px 0 8px; }
  .navlab:first-child { margin-left: 0; }
  nav button {
    background: var(--tag); color: var(--dim); border: 1px solid var(--line); border-radius: 6px;
    padding: 6px 12px; cursor: pointer; font: 700 12px/1 inherit; letter-spacing: 1.2px;
  }
  nav button.active { background: var(--gold); color: #14100a; border-color: var(--gold); }
  nav button.webtab.active { background: var(--blue); border-color: var(--blue); color: #06121c; }
  nav input {
    margin-left: auto; background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 7px 12px; min-width: 200px; font: 13px/1 inherit;
  }
  main { max-width: 1200px; margin: 0 auto; padding: 22px 20px 80px; }
  section.tab { display: none; }
  section.tab.on { display: block; }
  h2 { font-size: 17px; letter-spacing: 2.5px; color: var(--gold); border-bottom: 1px solid var(--line); padding-bottom: 6px; margin: 34px 0 6px; }
  h2:first-child { margin-top: 0; }
  .famblurb { color: var(--dim); font-size: 13px; margin: 0 0 14px; max-width: 920px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 12px; }
  .grid.wide { grid-template-columns: 1fr; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; }
  .card h3 { margin: 0 0 2px; font-size: 14.5px; letter-spacing: 1px; }
  .idrow { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
  .idrow code, code.k { background: var(--panel2); border: 1px solid var(--line); border-radius: 4px; padding: 1px 5px; color: var(--blue); font-size: 11px; }
  .pill { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 1px; border-radius: 4px; padding: 2px 7px; margin-right: 5px; vertical-align: 1px; }
  .pill.player { background: #1d3a2a; color: var(--up); }
  .pill.coach { background: #241d3a; color: var(--purple); }
  .pill.wt { background: var(--tag); color: var(--gold); }
  .pill.rare { background: #2a2440; color: var(--purple); }
  .pill.legendary { background: #3a2a14; color: var(--gold); }
  .pill.common { background: var(--tag); color: var(--mid); }
  .pill.supply { background: #14303a; color: #67d8e8; }
  .pill.reward { background: #1d3a2a; color: var(--up); }
  .pill.punish { background: #3a1d1d; color: var(--down); }
  .pill.seed { background: #14303a; color: #67d8e8; }
  .pill.draft { background: #3a2a14; color: var(--gold); }
  .chip { display: inline-block; font-size: 10.5px; font-weight: 700; letter-spacing: 0.8px; border-radius: 999px; padding: 2px 9px; margin: 0 4px 4px 0; border: 1px solid var(--line); background: var(--panel2); color: var(--mid); }
  .trigger { font-size: 12.5px; color: var(--blue); margin: 0 0 10px; }
  .trigger b { color: var(--ink); }
  .beat { border-left: 3px solid var(--line); padding: 2px 0 2px 12px; margin: 10px 0; }
  .beat .bkey { font-size: 10.5px; letter-spacing: 1.5px; color: var(--gold); font-weight: 800; }
  .beat .setup { font-size: 13.5px; font-style: italic; margin: 3px 0 8px; }
  .choice { background: var(--panel2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; margin: 6px 0; }
  .choice .lbl { font-weight: 700; font-size: 13px; letter-spacing: 0.4px; }
  .choice .lbl .cost { color: var(--gold); }
  .odds { font-size: 11.5px; margin: 3px 0 0; }
  .odds .u { color: var(--up); } .odds .d { color: var(--down); }
  .odds .want { color: var(--dim); font-style: italic; }
  .outs { margin: 6px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
  .outs li { margin: 3px 0; padding-left: 18px; position: relative; color: var(--mid); }
  .outs li::before { position: absolute; left: 0; font-weight: 800; }
  .outs li.u { color: #b7e8c8; } .outs li.u::before { content: '▲'; color: var(--up); }
  .outs li.m::before { content: '■'; color: var(--mid); }
  .outs li.d { color: #f0bcbc; } .outs li.d::before { content: '▼'; color: var(--down); }
  .follow { font-size: 12px; color: var(--purple); margin-top: 8px; }
  .follow b { letter-spacing: 1px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th { text-align: left; color: var(--dim); font-size: 11px; letter-spacing: 1.5px; border-bottom: 1px solid var(--line); padding: 6px 10px 6px 0; }
  td { border-bottom: 1px solid var(--line); padding: 7px 10px 7px 0; vertical-align: top; }
  td.name { font-weight: 700; white-space: nowrap; }
  .swatch { display: inline-block; width: 14px; height: 14px; border-radius: 3px; vertical-align: -2px; margin-right: 4px; border: 1px solid #ffffff30; }
  .flav { color: var(--dim); font-style: italic; font-size: 12.5px; }
  .weekstop { border-left: 3px solid var(--gold); }
  .weekstop h3 { color: var(--gold); letter-spacing: 1.5px; }
  .weekstop .what { font-size: 13.5px; margin: 4px 0 8px; }
  .dice { margin: 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--mid); }
  .dice li { padding-left: 18px; position: relative; margin: 3px 0; }
  .dice li::before { content: '⚂'; position: absolute; left: 0; color: var(--blue); }
  pre { background: var(--panel2); border: 1px solid var(--line); border-radius: 8px; padding: 14px; font-size: 12px; overflow-x: auto; color: #b8e6c9; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .legend .card ul { margin: 6px 0 0; padding-left: 0; list-style: none; font-size: 12.5px; }
  .legend .card li { margin: 3px 0; }
  .legend .card li b { display: inline-block; min-width: 130px; letter-spacing: 1px; font-size: 11px; }
  .hide { display: none !important; }
  .count { color: var(--dim); font-size: 12px; font-weight: 400; letter-spacing: 0; margin-left: 8px; }
  .namecloud { line-height: 2; }
  .namecloud span { background: var(--panel2); border: 1px solid var(--line); border-radius: 5px; padding: 2px 8px; margin: 2px; display: inline-block; font-size: 12.5px; }
  /* ---- story-web bits ---- */
  .stk { display: inline-block; font-size: 10px; font-weight: 800; letter-spacing: 1.2px; border-radius: 4px; padding: 2px 8px; margin-left: 8px; }
  .stk.safe { background: #e5e7eb; color: #1b1f2c; }
  .stk.sure { background: #fde047; color: #302a06; }
  .stk.risky { background: #fb923c; color: #331603; }
  .stk.danger { background: #ef4444; color: #fff; animation: blink 0.9s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.35; } }
  .goodpct { font-size: 11.5px; font-weight: 800; color: var(--up); margin-left: 8px; letter-spacing: 0.5px; }
  .faces { margin: 8px 0 0; padding: 0; list-style: none; font-size: 12.5px; }
  .faces li { margin: 5px 0; padding-left: 24px; position: relative; }
  .faces li .fico { position: absolute; left: 0; top: 0; font-weight: 800; width: 20px; }
  .faces li .fpct { font-weight: 800; font-size: 11px; margin-right: 6px; }
  .faces li.fc { color: #ffb4b4; } .faces li.fc .fico, .faces li.fc .fpct { color: #ef4444; }
  .faces li.fb { color: #f0ccbc; } .faces li.fb .fico, .faces li.fb .fpct { color: var(--down); }
  .faces li.fn { color: var(--mid); } .faces li.fn .fico, .faces li.fn .fpct { color: var(--mid); }
  .faces li.fg { color: #b7e8c8; } .faces li.fg .fico, .faces li.fg .fpct { color: var(--up); }
  .faces li.fm { color: #ffe9b8; } .faces li.fm .fico, .faces li.fm .fpct { color: var(--gold); }
  .faces .fx { display: block; font-size: 11px; color: var(--blue); font-style: normal; margin-top: 1px; }
  .charchip { display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: 1px; border-radius: 999px; padding: 3px 11px; border: 1.5px solid; margin-right: 6px; }
  #webmap { width: 100%; overflow-x: auto; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; margin-bottom: 16px; }
  #webmap svg text { font: 700 11px -apple-system, sans-serif; fill: var(--ink); letter-spacing: 0.5px; }
  #webmap svg text.sm { font-size: 9px; font-weight: 400; fill: var(--dim); }
  #webmap svg .node { cursor: pointer; }
  /* ---- builder ---- */
  .bform label { display: block; font-size: 10.5px; letter-spacing: 1.5px; color: var(--dim); font-weight: 800; margin: 12px 0 3px; }
  .bform input[type=text], .bform input[type=number], .bform textarea, .bform select {
    width: 100%; background: var(--panel2); border: 1px solid var(--line); color: var(--ink);
    border-radius: 6px; padding: 7px 10px; font: 13px/1.4 inherit;
  }
  .bform textarea { min-height: 54px; resize: vertical; }
  .frow { display: flex; gap: 10px; } .frow > div { flex: 1; }
  .momtog { cursor: pointer; user-select: none; }
  .momtog.on { background: var(--blue); color: #06121c; border-color: var(--blue); }
  .bchoice { border: 1px dashed var(--line); border-radius: 8px; padding: 10px 12px; margin: 10px 0; background: #10162a; }
  .bchoice .dicein { display: flex; gap: 6px; align-items: center; }
  .bchoice .dicein div { flex: 1; }
  .bchoice .dicein span.dlab { display: block; font-size: 9px; letter-spacing: 1px; color: var(--dim); font-weight: 800; text-align: center; margin-bottom: 2px; }
  .bface { display: flex; gap: 8px; margin: 6px 0; align-items: flex-start; }
  .bface .fico { width: 88px; flex: none; font-size: 10px; font-weight: 800; letter-spacing: 1px; padding-top: 8px; text-align: right; }
  .bface textarea { min-height: 36px; flex: 2; }
  .bface input { flex: 1; }
  button.act { background: var(--gold); color: #14100a; border: 0; border-radius: 6px; padding: 8px 16px; font: 800 12px/1 inherit; letter-spacing: 1.5px; cursor: pointer; margin: 12px 8px 0 0; }
  button.act.ghost { background: var(--tag); color: var(--dim); border: 1px solid var(--line); }
  button.act.warn { background: #3a1d1d; color: var(--down); border: 1px solid #5a2d2d; }
  .dicelive { font-size: 11.5px; margin-top: 5px; }
  .dicelive .err { color: var(--down); font-weight: 800; }
  @media (max-width: 700px) { .legend { grid-template-columns: 1fr; } nav input { min-width: 130px; } .frow { flex-direction: column; } }
</style>
</head>
<body>
<header>
  <h1>THE WRITERS' ROOM <small>GALACTIC COACH · story design · v5 STORY WEB blueprint + v4.4.1 reference</small></h1>
  <p class="sub">Stories are a web: TRIGGER MOMENT → CHARACTER → CHOICE → the five-face die → results that are themselves triggers. Build modules in the BUILDER; export; Claude wires them in.</p>
  <nav id="nav">
    <span class="navlab">THE STORY WEB</span>
    <button class="webtab" data-tab="blueprint">BLUEPRINT</button>
    <button class="webtab" data-tab="moments">MOMENTS</button>
    <button class="webtab" data-tab="characters">CHARACTERS</button>
    <button class="webtab" data-tab="outcomes">OUTCOMES</button>
    <button class="webtab" data-tab="modules">MODULES</button>
    <button class="webtab" data-tab="builder">BUILDER</button>
    <span class="navlab">V4.4 REFERENCE</span>
    <button data-tab="week">WEEK</button>
    <button data-tab="stories">STORIES</button>
    <button data-tab="bag">BAG</button>
    <button data-tab="actions">ACTIONS</button>
    <button data-tab="world">WORLD</button>
    <button data-tab="dials">DIALS</button>
    <input id="search" type="search" placeholder="search everything…">
  </nav>
</header>
<main id="main"></main>

<script src="data.js"></script>
<script src="blueprint.js"></script>
<script>
const $ = (sel, el = document) => el.querySelector(sel);
const $$ = (sel, el = document) => [...el.querySelectorAll(sel)];
const esc = (s) => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;');
const charById = (id) => CHARACTERS.find((c) => c.id === id) || { id, name: id.toUpperCase(), color: '#8b96b3' };
const momById = (id) => MOMENTS.find((m) => m.id === id) || { id, name: id.toUpperCase() };

// ---------------- drafts (localStorage) ----------------
let drafts = [];
try { drafts = JSON.parse(localStorage.getItem('wr-drafts') || '[]'); } catch (e) { drafts = []; }
const saveDrafts = () => localStorage.setItem('wr-drafts', JSON.stringify(drafts));
const allModules = () => [...SEED_MODULES, ...drafts];

// ---------------- shared renderers ----------------
const FACE_META = [
  ['c', '💀', 'fc', 'CATASTROPHE'], ['b', '▼', 'fb', 'BAD'], ['n', '■', 'fn', 'NOTHING'],
  ['g', '▲', 'fg', 'GOOD'], ['m', '★', 'fm', 'MIRACLE'],
];

function stickerHtml(dice) {
  const s = RISK.sticker(dice);
  const lbl = { safe: 'safe', sure: 'sure?', risky: 'risky', danger: 'DANGER' }[s];
  return `<span class="goodpct">GOOD ${RISK.good(dice)}%</span><span class="stk ${s}">${lbl}</span>`;
}

function moduleCard(mod, opts = {}) {
  const ch = charById(mod.character);
  const choices = (mod.choices || []).map((c) => {
    const faces = FACE_META.map(([k, ico, cls, name], i) => {
      const f = (c.faces || {})[k] || {};
      const w = (c.dice || [0, 0, 0, 0, 0])[i];
      if (!f.tell && !f.fx && !w) return '';
      return `<li class="${cls}"><span class="fico">${ico}</span><span class="fpct">${w}%</span>${esc(f.tell || '—')}${f.fx ? `<span class="fx">⚙ ${esc(f.fx)}</span>` : ''}</li>`;
    }).join('');
    return `<div class="choice">
      <div class="lbl">${esc(c.label)}${c.cost ? ` <span class="cost">(${c.cost}¢)</span>` : ''}${stickerHtml(c.dice || [0, 0, 100, 0, 0])}</div>
      <ul class="faces">${faces}</ul>
    </div>`;
  }).join('');
  return `<div class="card" data-search id="mod-${esc(mod.id)}">
    <h3>${esc(mod.name)}</h3>
    <div class="idrow">
      <span class="pill ${mod.status === 'seed' ? 'seed' : 'draft'}">${mod.status === 'seed' ? 'SEED' : 'DRAFT'}</span>
      <code>${esc(mod.id)}</code>
    </div>
    <div style="margin-bottom:8px">
      <span class="charchip" style="color:${ch.color};border-color:${ch.color}">${esc(ch.name)}</span>
      ${(mod.moments || []).map((m) => `<span class="chip">${esc(momById(m).name)}</span>`).join('')}
    </div>
    <p class="beat setup" style="border-left:3px solid ${ch.color}">${esc(mod.setup)}</p>
    ${choices}
    ${opts.buttons ? `<div><button class="act ghost" data-edit="${esc(mod.id)}">EDIT</button><button class="act warn" data-del="${esc(mod.id)}">DELETE</button></div>` : ''}
  </div>`;
}

// ---------------- the web map (SVG) ----------------
function chainLinks(mod) {
  const out = [];
  for (const c of mod.choices || []) {
    for (const [k] of FACE_META) {
      const fx = ((c.faces || {})[k] || {}).fx || '';
      for (const m of fx.matchAll(/chain:([a-z0-9_]+)/gi)) {
        if (m[1] !== mod.id) out.push(m[1]);
      }
    }
  }
  return [...new Set(out)];
}

function webMapSvg() {
  const mods = allModules();
  const ids = new Set(mods.map((m) => m.id));
  const ghosts = new Set();
  const edges = [];
  for (const m of mods) for (const t of chainLinks(m)) {
    edges.push([m.id, t]);
    if (!ids.has(t)) ghosts.add(t);
  }
  const nodes = [...mods.map((m) => ({ id: m.id, name: m.name, ch: charById(m.character), ghost: false })),
    ...[...ghosts].map((g) => ({ id: g, name: g.toUpperCase().replace(/_/g, ' '), ch: { color: '#8b96b3' }, ghost: true }))];
  // depth = longest path from a root (ignore cycles via iteration cap)
  const incoming = new Map(nodes.map((n) => [n.id, edges.filter(([, t]) => t === n.id).map(([s]) => s)]));
  const depth = new Map(nodes.map((n) => [n.id, 0]));
  for (let i = 0; i < nodes.length + 2; i++) {
    let changed = false;
    for (const n of nodes) {
      const d = Math.max(0, ...(incoming.get(n.id) || []).map((p) => (depth.get(p) ?? 0) + 1));
      if (d > (depth.get(n.id) ?? 0) && d < 10) { depth.set(n.id, d); changed = true; }
    }
    if (!changed) break;
  }
  const cols = new Map();
  for (const n of nodes) {
    const d = depth.get(n.id) ?? 0;
    if (!cols.has(d)) cols.set(d, []);
    cols.get(d).push(n);
  }
  const NW = 182, NH = 46, GX = 250, GY = 68, PAD = 24;
  const pos = new Map();
  for (const [d, list] of cols) list.forEach((n, i) => pos.set(n.id, { x: PAD + d * GX, y: PAD + i * GY }));
  const maxD = Math.max(...[...cols.keys()], 0);
  const maxRows = Math.max(...[...cols.values()].map((l) => l.length), 1);
  const W = PAD * 2 + maxD * GX + NW, H = PAD * 2 + maxRows * GY;
  const edgeHtml = edges.map(([s, t]) => {
    const a = pos.get(s), b = pos.get(t);
    if (!a || !b) return '';
    const x1 = a.x + NW, y1 = a.y + NH / 2, x2 = b.x, y2 = b.y + NH / 2;
    return `<path d="M${x1},${y1} C${x1 + 60},${y1} ${x2 - 60},${y2} ${x2},${y2}" fill="none" stroke="#4a9ed4" stroke-width="1.5" opacity="0.7" marker-end="url(#arr)"/>`;
  }).join('');
  const nodeHtml = nodes.map((n) => {
    const p = pos.get(n.id);
    return `<g class="node" data-node="${esc(n.id)}" transform="translate(${p.x},${p.y})">
      <rect width="${NW}" height="${NH}" rx="9" fill="#131a2c" stroke="${n.ch.color}" stroke-width="1.6" ${n.ghost ? 'stroke-dasharray="4 4" opacity="0.55"' : ''}/>
      <text x="11" y="19">${esc(n.name.length > 24 ? n.name.slice(0, 23) + '…' : n.name)}</text>
      <text x="11" y="35" class="sm">${n.ghost ? 'not built yet — v4.4 story exists' : esc((n.ch.name || '').toLowerCase())}</text>
    </g>`;
  }).join('');
  return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">
    <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a9ed4"/></marker></defs>
    ${edgeHtml}${nodeHtml}</svg>`;
}

// ---------------- legacy renderers (v4.4 reference) ----------------
function choiceHtml(c) {
  if (!c.up && !c.down && !c.out && !c.cost) return `<div class="choice"><div class="lbl">${esc(c.label)}</div></div>`;
  const odds = [];
  if (c.up) odds.push(`<span class="u">▲ ${esc(c.up)}</span>`);
  if (c.down) odds.push(`<span class="d">▼ ${esc(c.down)}</span>`);
  if (c.want) odds.push(`<span class="want">he ${c.want === 'love' ? 'WANTS this' : 'HATES this'}</span>`);
  const outs = [];
  if (c.out) {
    if (c.out.up) outs.push(`<li class="u">${esc(c.out.up)}</li>`);
    if (c.out.mid) outs.push(`<li class="m">${esc(c.out.mid)}</li>`);
    if (c.out.down) outs.push(`<li class="d">${esc(c.out.down)}</li>`);
  }
  return `<div class="choice"><div class="lbl">${esc(c.label)}${c.cost ? ` <span class="cost">(${c.cost}¢)</span>` : ''}</div>
    ${odds.length ? `<div class="odds">${odds.join(' · ')}</div>` : ''}
    ${outs.length ? `<ul class="outs">${outs.join('')}</ul>` : ''}</div>`;
}
function storyCard(st) {
  const pills = [`<span class="pill ${st.who}">${st.who.toUpperCase()}</span>`];
  if (st.weight) pills.push(`<span class="pill wt">WEIGHT ${st.weight}</span>`);
  if (st.forms) pills.push(`<span class="pill wt">${st.forms.join('/').toUpperCase()} ONLY</span>`);
  const beats = (st.beats || []).map((b) => `<div class="beat">
      ${(st.beats.length > 1 || b.key !== 'start') ? `<div class="bkey">BEAT · ${esc(b.key)}</div>` : ''}
      <div class="setup">${esc(b.setup)}</div>${(b.choices || []).map(choiceHtml).join('')}</div>`).join('');
  return `<div class="card" data-search><h3>${esc(st.name)}</h3>
    <div class="idrow">${pills.join('')} <code>${st.id}</code></div>
    <p class="trigger"><b>Fires:</b> ${esc(st.trigger)}${st.when ? ` <b>Gate:</b> ${esc(st.when)}` : ''}</p>
    ${beats}
    ${st.follow ? `<p class="follow"><b>SPACING:</b> ${esc(st.follow)}</p>` : ''}
    ${st.chain ? `<p class="follow"><b>CHAINS →</b> ${esc(st.chain)}</p>` : ''}</div>`;
}
function itemCard(it) {
  const pills = [`<span class="pill ${it.rarity}">${it.rarity.toUpperCase()}</span>`];
  if (it.supply) pills.push('<span class="pill supply">SUPPLY DRIP</span>');
  if (it.target) pills.push('<span class="pill wt">DRAG ON PLAYER</span>');
  const outs = [];
  if (it.out) {
    if (it.out.up) outs.push(`<li class="u">${esc(it.out.up)}</li>`);
    if (it.out.mid) outs.push(`<li class="m">${esc(it.out.mid)}</li>`);
    if (it.out.down) outs.push(`<li class="d">${esc(it.out.down)}</li>`);
  }
  const odds = [];
  if (it.up) odds.push(`<span class="u">▲ ${esc(it.up)}</span>`);
  if (it.down) odds.push(`<span class="d">▼ ${esc(it.down)}</span>`);
  return `<div class="card" data-search><h3>${esc(it.name)}</h3>
    <div class="idrow">${pills.join('')} <code>${it.id}</code> · slot label <b>${esc(it.short)}</b> · pulses in: ${it.context.join(', ')}</div>
    <p class="flav">${esc(it.flavor)}</p>
    <p style="font-size:13px;margin:6px 0"><b>Effect:</b> ${esc(it.effect)}</p>
    ${odds.length ? `<div class="odds">${odds.join(' · ')}</div>` : ''}
    ${outs.length ? `<ul class="outs">${outs.join('')}</ul>` : ''}</div>`;
}
function actionTable(group) {
  const hasCost = group.rows.some((r) => r.cost !== undefined);
  return `<div class="card" data-search style="margin-bottom:12px">
    <h3 style="letter-spacing:1px;color:var(--blue)">${esc(group.name)}</h3>
    <table><thead><tr><th>MOVE</th>${hasCost ? '<th>¢</th>' : ''}<th>DOES</th><th>TAILS</th></tr></thead><tbody>
    ${group.rows.map((r) => `<tr>
      <td class="name">${esc(r.name)}<br><span class="flav" style="white-space:normal">${esc(r.desc || '')}</span></td>
      ${hasCost ? `<td>${r.cost ?? ''}</td>` : ''}
      <td>${esc(r.effect || '')}${r.scope ? `<br><span class="flav">${esc(r.scope)}</span>` : ''}</td>
      <td>${r.up ? `<span class="odds u">▲ ${esc(r.up)}</span><br>` : ''}${r.down ? `<span class="odds d">▼ ${esc(r.down)}</span>` : ''}</td>
    </tr>`).join('')}</tbody></table></div>`;
}

// ---------------- the forge ----------------
const blankChoice = () => ({ label: '', cost: 0, dice: [2, 5, 84, 8, 1], faces: { c: { tell: '', fx: '' }, b: { tell: '', fx: '' }, n: { tell: '', fx: '' }, g: { tell: '', fx: '' }, m: { tell: '', fx: '' } } });
const blankModule = () => ({ id: '', name: '', status: 'draft', character: 'dean', moments: [], setup: '', choices: [blankChoice()] });

function renderForge(mod) {
  const forge = $('#forge');
  if (!forge) return;
  forge.dataset.editing = mod.id || '';
  const charOpts = CHARACTERS.map((c) => `<option value="${c.id}" ${c.id === mod.character ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  const momToggles = MOMENTS.map((m) => `<span class="chip momtog ${mod.moments.includes(m.id) ? 'on' : ''}" data-mom="${m.id}">${esc(m.name)}</span>`).join('');
  const choiceBlocks = mod.choices.map((c, ci) => forgeChoiceHtml(c, ci)).join('');
  forge.innerHTML = `
    <div class="frow">
      <div><label>MODULE ID (snake_case)</label><input type="text" id="b-id" value="${esc(mod.id)}" placeholder="oracle_chosen"></div>
      <div><label>NAME</label><input type="text" id="b-name" value="${esc(mod.name)}" placeholder="THE CHOSEN ONE"></div>
      <div><label>CHARACTER</label><select id="b-char">${charOpts}</select></div>
    </div>
    <label>TRIGGER MOMENTS (tap to toggle)</label>
    <div id="b-moms">${momToggles}</div>
    <label>SETUP (the character's opening scene)</label>
    <textarea id="b-setup" placeholder="Deep in uncharted space, the oracle's moon swings into view uninvited…">${esc(mod.setup)}</textarea>
    <div id="bchoices">${choiceBlocks}</div>
    <button class="act ghost" id="b-addchoice">+ ADD CHOICE</button>`;
  $$('#b-moms .momtog', forge).forEach((t) => t.addEventListener('click', () => t.classList.toggle('on')));
  $('#b-addchoice').addEventListener('click', () => {
    const cur = readForge();
    cur.choices.push(blankChoice());
    renderForge(cur);
  });
  forge.addEventListener('input', (e) => {
    if (e.target.classList.contains('dnum')) updateDiceLive(e.target.closest('.bchoice'));
  });
  $$('.b-rmchoice', forge).forEach((b) => b.addEventListener('click', () => {
    const cur = readForge();
    cur.choices.splice(Number(b.dataset.ci), 1);
    if (!cur.choices.length) cur.choices.push(blankChoice());
    renderForge(cur);
  }));
}

function forgeChoiceHtml(c, ci) {
  const faceRows = FACE_META.map(([k, ico, cls, name]) => `
    <div class="bface">
      <span class="fico ${cls}" style="color:inherit">${ico} ${name}</span>
      <textarea class="ftell" data-face="${k}" placeholder="aftermath dialogue…">${esc((c.faces[k] || {}).tell || '')}</textarea>
      <input type="text" class="ffx" data-face="${k}" placeholder="⚙ e.g. player_lost · chain:empty_locker (+2w)" value="${esc((c.faces[k] || {}).fx || '')}">
    </div>`).join('');
  return `<div class="bchoice" data-ci="${ci}">
    <div class="frow">
      <div style="flex:2"><label>CHOICE LABEL (terse!)</label><input type="text" class="clabel" value="${esc(c.label)}" placeholder="GO FIND THE CHOSEN ONE"></div>
      <div style="flex:0 0 90px"><label>COST ¢</label><input type="number" class="ccost" min="0" max="9" value="${c.cost || 0}"></div>
      <div style="flex:0 0 110px;align-self:flex-end;text-align:right"><button class="act warn b-rmchoice" data-ci="${ci}" style="margin:0">REMOVE</button></div>
    </div>
    <label>THE FIVE-FACE DIE (must sum 100)</label>
    <div class="dicein">
      ${['💀 CAT', '▼ BAD', '■ NOTHING', '▲ GOOD', '★ MIRACLE'].map((lab, i) => `<div><span class="dlab">${lab}</span><input type="number" class="dnum" data-di="${i}" min="0" max="100" value="${c.dice[i]}"></div>`).join('')}
    </div>
    <div class="dicelive"></div>
    ${faceRows}
  </div>`;
}

function updateDiceLive(block) {
  if (!block) return;
  const dice = $$('.dnum', block).map((i) => Number(i.value) || 0);
  const sum = dice.reduce((a, b) => a + b, 0);
  const live = $('.dicelive', block);
  live.innerHTML = sum === 100
    ? `sums 100 ✓ &nbsp; ${stickerHtml(dice)}`
    : `<span class="err">sums ${sum} — must be 100</span>`;
}

function readForge() {
  const forge = $('#forge');
  return {
    id: $('#b-id').value.trim().toLowerCase().replace(/[^a-z0-9_]+/g, '_'),
    name: $('#b-name').value.trim(),
    status: 'draft',
    character: $('#b-char').value,
    moments: $$('#b-moms .momtog.on').map((t) => t.dataset.mom),
    setup: $('#b-setup').value.trim(),
    choices: $$('.bchoice', forge).map((block) => ({
      label: $('.clabel', block).value.trim(),
      cost: Number($('.ccost', block).value) || 0,
      dice: $$('.dnum', block).map((i) => Number(i.value) || 0),
      faces: Object.fromEntries(FACE_META.map(([k]) => [k, {
        tell: $(`.ftell[data-face=${k}]`, block).value.trim(),
        fx: $(`.ffx[data-face=${k}]`, block).value.trim(),
      }])),
    })),
  };
}

function refreshDraftViews() {
  const cards = $('#draftcards');
  if (cards) cards.innerHTML = drafts.map((m) => moduleCard(m, { buttons: true })).join('') || '<p class="famblurb">Nothing yet — build one in the BUILDER tab.</p>';
  const count = $('#draftcount');
  if (count) count.textContent = drafts.length;
  const map = $('#webmap');
  if (map) map.innerHTML = webMapSvg();
  wireWebMap();
  wireDraftButtons();
}

function wireDraftButtons() {
  $$('#draftcards [data-edit]').forEach((b) => b.addEventListener('click', () => {
    const mod = drafts.find((d) => d.id === b.dataset.edit);
    if (mod) { renderForge(JSON.parse(JSON.stringify(mod))); setTab('builder'); window.scrollTo(0, 0); }
  }));
  $$('#draftcards [data-del]').forEach((b) => b.addEventListener('click', () => {
    drafts = drafts.filter((d) => d.id !== b.dataset.del);
    saveDrafts(); refreshDraftViews();
  }));
}

function wireBuilder() {
  $('#b-save').addEventListener('click', () => {
    const mod = readForge();
    if (!mod.id || !mod.name || !mod.setup || !mod.choices.some((c) => c.label)) {
      alert('Needs at least: an id, a name, a setup, and one labeled choice.'); return;
    }
    const badDice = mod.choices.find((c) => c.label && c.dice.reduce((a, b) => a + b, 0) !== 100);
    if (badDice) { alert(`"${badDice.label}" — the five faces must sum to 100.`); return; }
    mod.choices = mod.choices.filter((c) => c.label);
    const ix = drafts.findIndex((d) => d.id === mod.id);
    if (ix >= 0) drafts[ix] = mod; else drafts.push(mod);
    saveDrafts(); refreshDraftViews(); renderForge(blankModule());
    setTab('modules');
    setTimeout(() => { const el = document.getElementById('mod-' + mod.id); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }, 50);
  });
  $('#b-new').addEventListener('click', () => renderForge(blankModule()));
  $('#b-export').addEventListener('click', async () => {
    const json = JSON.stringify(drafts, null, 2);
    const box = $('#exportbox');
    box.classList.remove('hide');
    box.textContent = json;
    try { await navigator.clipboard.writeText(json); box.textContent = '// copied to clipboard ✓ — paste it to Claude\n' + json; } catch (e) { /* shown below anyway */ }
  });
  $('#b-import').addEventListener('click', () => {
    try {
      const arr = JSON.parse($('#importbox').value);
      if (!Array.isArray(arr)) throw new Error('not an array');
      for (const mod of arr) {
        if (!mod.id) continue;
        mod.status = 'draft';
        const ix = drafts.findIndex((d) => d.id === mod.id);
        if (ix >= 0) drafts[ix] = mod; else drafts.push(mod);
      }
      saveDrafts(); refreshDraftViews(); $('#importbox').value = '';
    } catch (e) { alert('Could not parse that JSON: ' + e.message); }
  });
  $$('#forge .bchoice').forEach(updateDiceLive);
}

function wireWebMap() {
  $$('#webmap .node').forEach((n) => n.addEventListener('click', () => {
    const el = document.getElementById('mod-' + n.dataset.node);
    if (el) { setTab('modules'); el.scrollIntoView({ behavior: 'smooth', block: 'center' }); }
  }));
}

// ---------------- tabs + search ----------------
let active = localStorage.getItem('wr-tab') || 'blueprint';
function setTab(t) {
  active = t;
  localStorage.setItem('wr-tab', t);
  $$('nav button').forEach((b) => b.classList.toggle('active', b.dataset.tab === t));
  applyFilter();
}
function applyFilter() {
  const q = $('#search').value.trim().toLowerCase();
  $$('section.tab').forEach((sec) => {
    const isActive = sec.id === 'tab-' + active;
    if (!q) {
      sec.classList.toggle('on', isActive);
      $$('[data-search]', sec).forEach((c) => c.classList.remove('hide'));
      return;
    }
    let any = false;
    $$('[data-search]', sec).forEach((c) => {
      const hit = c.textContent.toLowerCase().includes(q);
      c.classList.toggle('hide', !hit);
      if (hit) any = true;
    });
    sec.classList.toggle('on', any);
  });
}
render();
refreshDraftViews();
$$('nav button').forEach((b) => b.addEventListener('click', () => { $('#search').value = ''; setTab(b.dataset.tab); }));
$('#search').addEventListener('input', applyFilter);
if (!document.getElementById('tab-' + active)) active = 'blueprint';
setTab(active);
</script>
</body>
</html>
